# dsh-lan-memory bundle patch: inserts the lan memory & persona plugin row
# into the profile roster. The host half (exports ".") runs in the DSH host
# process: local file memory engine, the lan_* agent tools, SOUL/MOOD prompt
# sections, the /lan-memory management panel, and zero-LLM journal capture.
#
# The browser half (exports "./client") only adds the "澜记忆" entry to the
# DSH settings page; the full management UI is served by the host at
# http://127.0.0.1:<dsh-port>/lan-memory/ and also embedded there.
- insert:
    - id: dsh-lan-memory
      name: 'dsh-lan-memory'
