# dsh-lan-memory bundle patch: inserts the lan memory & persona plugin row
# into the profile roster. The host half (exports ".") runs in the DSH host
# process: local file memory engine, the lan_* agent tools, SOUL/MOOD prompt
# sections, auto-compiled profile, and zero-LLM journal capture.
#
# The browser half (exports "./client") adds the "澜记忆" settings page with
# tabs for overview, memory, experience, inbox, persona and maintenance.
# There is no standalone /lan-memory panel.
- insert:
    - id: dsh-lan-memory
      name: 'dsh-lan-memory'
