        : (actions.length
          ? '<div class="actions-list">' + actions.map(actionRow).join('') + '</div>'
          : '<p class="hint" style="margin-top:8px">没有需要整理的动作。</p>')) +
      '</div>';
  }

  function actionRow(action) {
    var kind = action && action.kind ? String(action.kind) : 'none';
    var ids = Array.isArray(action && action.ids) ? action.ids : [];
    var kindClass = ['merge', 'rewrite', 'delete', 'tag', 'none'].indexOf(kind) >= 0 ? kind : 'none';
    return '<div class="action-row">' +
      '<span class="action-kind kind-' + kindClass + '">' + esc(kind) + '</span>' +
      (action && action.layer ? '<span class="pill">' + esc(action.layer) + '</span>' : '') +
      '<span class="action-preview">' + show(action && action.preview, '（无预览）') + '</span>' +
      (action && action.reason ? '<span class="muted small">' + esc(action.reason) + '</span>' : '') +
      (ids.length ? '<span class="chips">' + ids.map(function (id) {
        return '<span class="chip chip-tool">' + esc(id) + '</span>';
      }).join('') + '</span>' : '') +
      '</div>';
  }

  function migrateReportHTML(report) {
    var copied = Array.isArray(report && report.copied) ? report.copied : [];
    return '<div class="organize-report">' +
      '<div class="kv"><span>发现旧数据</span><b>' + (report && report.found ? '是' : '否') + '</b>' +
      '<span>复制文件</span><b>' + copied.length + ' 个</b></div>' +
      (copied.length
        ? '<div class="chips" style="margin-top:6px">' + copied.map(function (file) {
            return '<span class="chip chip-tool">' + esc(file) + '</span>';
          }).join('') + '</div>'
        : '') +
      '</div>';
  }

  function emptyState(message) {
    return '<div class="empty">' + esc(message) + '</div>';
  }

  /* ========================================================================
     条目查找 / 读取表单
     ======================================================================== */

  function findEntry(layer, key) {
    var state = store.state;
    if (!state) return null;
    if (layer === 'pinned') {
      var pinned = Array.isArray(state.pinned) ? state.pinned : [];
      var index = Number(key);
      if (!Number.isInteger(index) || index < 0 || index >= pinned.length) return null;
      if (!pinned[index]) return null;
      return { entry: pinned[index], index: index };
    }
    var arr = Array.isArray(state[layer]) ? state[layer] : [];
    for (var i = 0; i < arr.length; i += 1) {
      if (arr[i] && String(arr[i].id) === String(key)) return { entry: arr[i], index: i };
    }
    return null;
  }

  function readEntry(layer, prefix) {
    var content = getDraft(prefix + 'content', '');
    if (!String(content).trim()) {
      toast('内容不能为空', 'error');
      return null;
    }
    if (layer === 'pinned') {
      return { tag: String(getDraft(prefix + 'tag', '')).trim(), content: content };
    }
    if (layer === 'memory') {
      return { content: content, tags: parseTags(getDraft(prefix + 'tags', '')) };
    }
    return { category: String(getDraft(prefix + 'category', '')).trim(), content: content };
  }

  /* ========================================================================
     动作
     ======================================================================== */

  function switchTab(tab) {
    if (TAB_IDS.indexOf(tab) < 0) return;
    store.tab = tab;
    render();
    if (tab === 'maint' && !store.backups.items && !store.backups.loading && !store.backups.error) {
      loadBackups();
    }
  }

  function openEdit(layer, key) {
    var found = findEntry(layer, key);
    if (!found) {
      toast('条目不存在，可能已被其他窗口修改，请刷新', 'error');
      return;
    }
    var prefix = 'edit.' + layer + '.' + key + '.';
    clearDrafts(prefix);
    var entry = found.entry;
    if (layer === 'pinned') {
      store.drafts[prefix + 'tag'] = entry.tag || '';
      store.drafts[prefix + 'content'] = entry.content || '';
    } else if (layer === 'memory') {
      store.drafts[prefix + 'tags'] = Array.isArray(entry.tags) ? entry.tags.join(', ') : '';
      store.drafts[prefix + 'content'] = entry.content || '';
    } else {
      store.drafts[prefix + 'category'] = entry.category || '';
      store.drafts[prefix + 'content'] = entry.content || '';
    }
    store.edit = { layer: layer, key: String(key), index: found.index };
    store.addLayer = null;
    store.promote = null;
    store.confirm = null;
    render();
  }

  async function saveEdit() {
    var edit = store.edit;
    if (!edit) return;
    var prefix = 'edit.' + edit.layer + '.' + edit.key + '.';
    var entry = readEntry(edit.layer, prefix);
    if (!entry) return;
    var payload = { layer: edit.layer, action: 'update', entry: entry };
    if (edit.layer === 'pinned') {
      var found = findEntry('pinned', edit.key);
      if (!found) {
        toast('条目已变化，请刷新后重试', 'error');
        return;
      }
      payload.index = found.index;
    } else {
      payload.id = edit.key;
    }
    await withBusy('edit', async function () {
      await apiWrite('memory', payload);
      store.edit = null;
      clearDrafts('edit.');
      toast('已保存', 'ok');
      await loadState();
    });
  }

  async function saveAdd() {
    var layer = store.addLayer;
    if (!layer) return;
    var entry = readEntry(layer, 'add.');
    if (!entry) return;
    await withBusy('add', async function () {
      await apiWrite('memory', { layer: layer, action: 'add', entry: entry });
      store.addLayer = null;
      clearDrafts('add.');
      toast('已新增', 'ok');
      await loadState();
    });
  }

  async function confirmDelete() {
    var confirm = store.confirm;
    if (!confirm || confirm.kind !== 'del') return;
    var layer = confirm.layer;
    var found = findEntry(layer, confirm.key);
    if (!found) {
      toast('条目已变化，请刷新后重试', 'error');
      store.confirm = null;
      render();
      return;
    }
    var payload = { layer: layer, action: 'delete' };
    if (layer === 'pinned') payload.index = found.index;
    else payload.id = confirm.key;
    await withBusy('del', async function () {
      await apiWrite('memory', payload);
      store.confirm = null;
      toast('已删除', 'ok');
      await loadState();
    });
  }

  async function savePersona() {
    var persona = store.persona;
    if (!persona) return;
    await withBusy('persona', async function () {
      await apiWrite('persona', {
        soul: persona.soul,
        moodContract: persona.moodContract
      }, 'PUT');
      toast('人格已保存', 'ok');
      await loadState({ resetPersona: true });
    });
  }

  async function dismissItem(id) {
    await withBusy('dismiss', async function () {
      await apiWrite('journal', { action: 'dismiss', id: id });
      toast('已忽略', 'ok');
      await loadState();
    });
  }

  async function dismissAll() {
    var state = store.state;
    var journal = (state && state.journal) || {};
    var items = Array.isArray(journal.items) ? journal.items : [];
    var listed = items.filter(function (it) { return it && it.pending !== false; }).length;
    var pending = num(journal.pending !== undefined ? journal.pending : listed);
    await withBusy('dismissAll', async function () {
      await apiWrite('journal', { action: 'dismissAll' });
      store.confirm = null;
      toast('已忽略 ' + pending + ' 条待整理', 'ok');
      await loadState();
    });
  }

  async function promoteItem() {
    var promoting = store.promote;
    if (!promoting) return;
    var content = getDraft('promote.content', '');
    if (!String(content).trim()) {
      toast('内容不能为空', 'error');
      return;
    }
    var payload = { action: 'promote', id: promoting.id, layer: promoting.layer, content: content };
    if (promoting.layer === 'memory') {
      payload.tags = parseTags(getDraft('promote.tags', ''));
    }
    await withBusy('promote', async function () {
      await apiWrite('journal', payload);
      store.promote = null;
      clearDrafts('promote.');
      toast('已提炼为' + LAYERS[promoting.layer].full, 'ok');
      await loadState();
    });
  }

  async function doBackup() {
    await withBusy('backup', async function () {
      var data = await apiWrite('backup', {});
      toast('备份完成' + (data && data.dir ? '：' + baseName(data.dir) : ''), 'ok');
      store.backups.items = null;
      store.backups.error = null;
      await loadState();
      await loadBackups();
    });
  }

  async function loadBackups() {
    if (store.backups.loading) return;
    store.backups.loading = true;
    store.backups.error = null;
    render();
    try {
      var data = await apiGet('backups');
      store.backups.items = Array.isArray(data.items) ? data.items : [];
    } catch (err) {
      store.backups.error = err && err.message ? err.message : '读取失败';
      if (!(err instanceof ConflictError)) {
        toast('备份列表读取失败：' + store.backups.error, 'error');
      }
    } finally {
      store.backups.loading = false;
      render();
    }
  }

  async function restoreBackup(dir) {
    if (!dir) return;
    await withBusy('restore', async function () {
      await apiWrite('restore', { backup: dir });
      store.confirm = null;
      toast('已恢复备份：' + baseName(dir), 'ok');
      await loadState();
    });
  }

  async function saveSettings(key, value) {
    if (store.busy.has('settings')) return;
    var state = store.state;
    if (!state) return;
    if (!state.meta) state.meta = {};
    if (!state.meta.settings) state.meta.settings = {};
    var previous = state.meta.settings[key];
    state.meta.settings[key] = value;
    store.busy.add('settings');
    render();
    try {
      var settings = {
        captureEnabled: !!state.meta.settings.captureEnabled,
        autoOrganize: !!state.meta.settings.autoOrganize
      };
      await apiWrite('settings', { settings: settings });
      toast(key === 'captureEnabled'
        ? (value ? '已开启捕获' : '已关闭捕获')
        : (value ? '已开启自动整理' : '已关闭自动整理'), 'ok');
      await loadState();
    } catch (err) {
      state.meta.settings[key] = previous;
      if (!(err instanceof ConflictError)) {
        toast(err && err.message ? err.message : '设置保存失败', 'error');
        try {
          await loadState();
        } catch (refreshErr) {
          /* 保留本地回滚值即可 */
        }
      }
    } finally {
      store.busy.delete('settings');
      render();
    }
  }

  async function loadHealth() {
    if (store.healthLoading) return;
    store.healthLoading = true;
    render();
    try {
      var data = await apiGet('health');
      var health = data && data.capture ? data : (data && data.health ? data.health : data);
      store.health = health || null;
    } catch (err) {
      store.health = store.state ? store.state.health : null;
      toast('health 接口读取失败，已显示 state 中的缓存', 'warn');
    } finally {
      store.healthLoading = false;
      render();
    }
  }

  async function toggleHealth() {
    store.healthOpen = !store.healthOpen;
    render();
    if (store.healthOpen && !store.health) await loadHealth();
  }

  async function runOrganize(mode) {
    var orgBusy = Array.from(store.busy).some(function (key) { return key.indexOf('org-') === 0; });
    if (orgBusy) return;
    var key = 'org-' + mode;
    await withBusy(key, async function () {
      var data = await apiWrite('organize', { mode: mode });
      store.organize = {
        mode: mode,
        report: data.report || null,
        at: Date.now()
      };
      var labels = {
        'preview': '预览完成',
        'apply-local': '整理完成',
        'review-pack': '复核包已生成',
        'undo': '已撤销最近整理'
      };
      toast(labels[mode] || '完成', 'ok');
      if (mode === 'apply-local' || mode === 'undo') {
        await loadState();
      }
    });
  }

  async function doMigrate() {
    await withBusy('migrate', async function () {
      var data = await apiWrite('migrate', {});
      store.migrate = data.report || { found: false, copied: [] };
      var copied = Array.isArray(store.migrate.copied) ? store.migrate.copied : [];
      toast(store.migrate.found
        ? '迁移完成，复制 ' + copied.length + ' 个文件'
        : '未发现旧版数据', 'ok');
      await loadState();
    });
  }

  async function copyPack() {
    var pack = store.organize && store.organize.report && store.organize.report.pack;
    if (!pack) {
      toast('没有可复制的复核包', 'error');
      return;
    }
    try {
      await navigator.clipboard.writeText(pack);
      toast('复核包已复制', 'ok');
      return;
    } catch (err) {
      var pre = document.querySelector('.pack');
      if (!pre) {
        toast('复制失败，请手动选择文本', 'error');
        return;
      }
      try {
        var range = document.createRange();
        range.selectNodeContents(pre);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand('copy');
        toast('已复制到剪贴板', 'ok');
      } catch (err2) {
        toast('复制失败，请手动选择文本', 'error');
      }
    }
  }

  /* ========================================================================
     事件绑定
     ======================================================================== */

  function handleAction(el) {
    var act = el.dataset.act;
    if (!act) return;
    if (act === 'tab') {
      switchTab(el.dataset.tab);
      return;
    }
    if (act === 'layer') {
      store.layer = el.dataset.layer === 'memory' || el.dataset.layer === 'experience'
        ? el.dataset.layer
        : 'pinned';
      store.addLayer = null;
      store.edit = null;
      store.confirm = null;
      render();
      return;
    }
    if (act === 'refresh') {
      withBusy('refresh', async function () {
        await loadState();
        toast('已刷新', 'ok');
      });
      return;
    }
    if (act === 'retry') {
      store.loadError = null;
      store.busy.add('retry');
      render();
      loadState({ resetPersona: true }).catch(function (err) {
        store.loadError = err && err.message ? err.message : '加载失败';
        toast('加载失败：' + store.loadError, 'error');
      }).finally(function () {
        store.busy.delete('retry');
        render();
      });
      return;
    }
    if (act === 'add-open') {
      store.addLayer = store.layer;
      store.edit = null;
      store.promote = null;
      store.confirm = null;
      clearDrafts('add.');
      render();
      return;
    }
    if (act === 'add-cancel') {
      store.addLayer = null;
      clearDrafts('add.');
      render();
      return;
    }
    if (act === 'add-save') {
      saveAdd();
      return;
    }
    if (act === 'edit-open') {
      openEdit(el.dataset.layer, el.dataset.key);
      return;
    }
    if (act === 'edit-cancel') {
      store.edit = null;
      clearDrafts('edit.');
      render();
      return;
    }
    if (act === 'edit-save') {
      saveEdit();
      return;
    }
    if (act === 'del-ask') {
      store.confirm = { kind: 'del', layer: el.dataset.layer, key: String(el.dataset.key) };
      store.edit = null;
      render();
      return;
    }
    if (act === 'del-cancel') {
      store.confirm = null;
      render();
      return;
    }
    if (act === 'del-confirm') {
      confirmDelete();
      return;
    }
    if (act === 'promote-open') {
      var id = String(el.dataset.id || '');
      if (!id) return;
      store.promote = { id: id, layer: 'memory' };
      store.edit = null;
      store.confirm = null;
      clearDrafts('promote.');
      render();
      return;
    }
    if (act === 'promote-cancel') {
      store.promote = null;
      clearDrafts('promote.');
      render();
      return;
    }
    if (act === 'promote-save') {
      promoteItem();
      return;
    }
    if (act === 'dismiss') {
      dismissItem(String(el.dataset.id || ''));
      return;
    }
    if (act === 'dismiss-all-ask') {
      store.confirm = { kind: 'dismissAll' };
      render();
      return;
    }
    if (act === 'dismiss-all-cancel') {
      store.confirm = null;
      render();
      return;
    }
    if (act === 'dismiss-all-confirm') {
      dismissAll();
      return;
    }
    if (act === 'persona-save') {
      savePersona();
      return;
    }
    if (act === 'backup') {
      doBackup();
      return;
    }
    if (act === 'backups-refresh') {
      withBusy('backups', function () { return loadBackups(); });
      return;
    }
    if (act === 'restore-ask') {
      store.confirm = { kind: 'restore', dir: String(el.dataset.dir || '') };
      render();
      return;
    }
    if (act === 'restore-cancel') {
      store.confirm = null;
      render();
      return;
    }
    if (act === 'restore-confirm') {
      restoreBackup(String(el.dataset.dir || ''));
      return;
    }
    if (act === 'health-toggle') {
      toggleHealth();
      return;
    }
    if (act === 'health-refresh') {
      loadHealth();
      return;
    }
    if (act === 'organize') {
      runOrganize(el.dataset.mode || 'preview');
      return;
    }
    if (act === 'migrate') {
      doMigrate();
      return;
    }
    if (act === 'copy-pack') {
      copyPack();
      return;
    }
  }

  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    event.preventDefault();
    if (el.disabled) return;
    handleAction(el);
  });

  document.addEventListener('input', function (event) {
    var el = event.target;
    if (!el || !el.matches) return;
    if (el.matches('[data-search]')) {
      store.query = el.value;
      renderMemoryList();
      return;
    }
    if (el.matches('[data-model]')) {
      var model = el.dataset.model;
      store.drafts[model] = el.value;
      if (model === 'persona.soul' || model === 'persona.moodContract') {
        updatePersonaDirty(model, el.value);
      }
    }
  });

  function updatePersonaDirty(model, value) {
    var persona = store.persona;
    if (!persona) return;
    if (model === 'persona.soul') persona.soul = value;
    else persona.moodContract = value;
    persona.dirty = persona.soul !== persona.base.soul ||
      persona.moodContract !== persona.base.moodContract;
    updatePersonaChrome();
  }

  document.addEventListener('change', function (event) {
    var el = event.target;
    if (!el || !el.matches) return;
    if (el.matches('[data-setting]')) {
      saveSettings(el.dataset.setting, !!el.checked);
      return;
    }
    if (el.matches('[data-change="promote-layer"]')) {
      if (store.promote) {
        store.promote.layer = el.value === 'pinned' ? 'pinned' : 'memory';
        render();
      }
    }
  });

  document.addEventListener('toggle', function (event) {
    if (event.target && event.target.matches && event.target.matches('details.processed')) {
      store.showProcessed = !!event.target.open;
    }
  }, true);

  /* ========================================================================
     启动
     ======================================================================== */

  render();
  loadState({ resetPersona: true }).catch(function (err) {
    store.loadError = err && err.message ? err.message : '加载失败';
    render();
    toast('加载失败：' + store.loadError, 'error', 5000);
  });
})();
</script>
</body>
</html>
